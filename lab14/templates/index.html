<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Item</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <h1 class="title">Arnaud Tadonkeng</h1>

    <h2>Create item</h2>
    <form id="itemForm">
        <div class="formsession">
            <label>Name
                <input type="text" id="name" required>
            </label>
        </div>

        <div class="formsession">
            <label>Price
                <input type="text" id="price" required>
            </label>
        </div>

        <div class="formsession">
            <button type="submit">Add item</button>
        </div>

        <p id="response"></p>
    </form>

    <!-- LOADING ITEMS -->
    <section class="loaditems">
        <h2>All items</h2>
        <button type="button" onclick="loaditems()">Load items</button>
        <ul class="itemslist"></ul>
    </section>

    <!-- UPDATE AN ITEM NAME AND PRICE (hidden until Update is clicked) -->
    <section id="updatesection" style="display: none">
        <h3>Update item</h3>
        <input type="hidden" id="updateID">
        <label>Name
            <input type="text" id="updateName">
        </label>
        <label>Price
            <input type="text" id="updatePrice">
        </label>
        <button type="button" onclick="updateItem()">Save update</button>
    </section>

    <script src="{{url_for('static', filename='app_script.js')}}"></script>
</body>
</html>
